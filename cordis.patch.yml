# @fgfg163/dsh-prompt-slot bundle patch.
#
# The npm package name and the loader row `name` must match: the loader
# resolves this row with `import()`.
#
# Row id `fgfg163-prompt-slot` is the handle other patches/plugins target to
# change the process-wide budget. It is namespaced with the author so it cannot
# collide with anyone else's row.
#
# `position` is gone (0.3.0). Placement is chosen per slot by the contributor
# (`registerBefore()` / `registerAfter()`), not by a process-wide switch.
#
# `totalMaxChars` is intentionally **absent** (0.3.1): no total ceiling by
# default. Only per-slot `maxChars` applies. To impose one, add a positive
# integer here or fill the field in Settings → 提示注入槽.
- insert:
    - id: fgfg163-prompt-slot
      name: '@fgfg163/dsh-prompt-slot'
      config: {}
